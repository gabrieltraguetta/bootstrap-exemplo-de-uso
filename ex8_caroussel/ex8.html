<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>


    <!-- Construindo slide "carrosel do zero" -->
        <div class="container mt-3">
            <div id="carouselExemplo" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">

                    <!--Primeiro slide-->

                    <div class="carousel-item active">
                        <img src="https://placehold.co/600x400/000/fff" alt="Slide-1" class="d.block w-100">
                    </div>

                    <!-- Segundo slide -->
                    
                    <div class="carousel-item active">
                        <img src="https://placehold.co/600x400/000/fff" alt="Slide-2" class="d.block w-100">
                    </div>

                    <!-- terceiro slide -->
                    
                    <div class="carousel-item active">
                        <img src="https://placehold.co/600x400/orange/fff" alt="Slide-3" class="d.block w-100">
                    </div>

                    <!-- Adicionando Botoes de controle do carrosel-->

                    <!--Botão de retorno-->
                     <button class="carousel-control-prev" type="button" data-bs-target="#carouselExemplo" data-bs-slide="prev">
                        <spam class="carousel-control-prev-icon"></spam>
                    
                        <!--Botão de avanço-->
                     <button class="carousel-control-next" type="button" data-bs-target="#carouselExemplo" data-bs-slide="next">
                        <spam class="carousel-control-next-icon"></spam>
                   

                     </button>
                    


                </div>

            </div>
            
        </div>

    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
