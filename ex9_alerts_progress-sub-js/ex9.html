<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerts e Progress Bar Bootstrap Interativos</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container mt-3">

   
   
     <!-- ================================
         BOTÕES DE CONTROLE DOS ALERTS
    ================================= -->
    <div class="mb-3">
        <button class="btn btn-success me-2" onclick="mostrarSucesso()">Mostrar Sucesso</button>
        <button class="btn btn-danger me-2" onclick="mostrarErro()">Mostrar Erro</button>
        <button class="btn btn-warning me-2" onclick="mostrarToast()">Mostrar Toast</button>
    </div>


   
   
    <!-- ================================
         ALERT DE SUCESSO
    ================================= -->
    <div class="alert alert-success alert-dismissible fade" id="successAlert">
        <strong>Sucesso!</strong> Operação realizada com sucesso!
        <button class="btn-close" type="button" onclick="fecharAlert('successAlert')"></button>
    </div>


   
   
    <!-- ================================
         ALERT DE ERRO
    ================================= -->
    <div class="alert alert-danger alert-dismissible fade" id="errorAlert">
        <strong>Erro!</strong> Erro ao processar a operação!
        <button type="button" class="btn-close" onclick="fecharAlert('errorAlert')"></button>
    </div>


    
    
    <!-- ================================
         TOAST (NOTIFICAÇÃO FLUTUANTE)
    ================================= -->

    <div class="position-fixed top-50 start-0 p-3" style="z-index: 10;">
        <div id="LiveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">

            <div class="toast-header">
                <strong class="me-auto">Notificação</strong>
                <small>Agora</small>
                <button class="btn-close" type="button" data-bs-dismiss="toast"></button>
            </div>

            <!-- Corpo da notificação -->
            <div class="toast-body">
                Esta é uma mensagem de Toast!
            </div>

        </div>
    </div>


    
    
    <!-- ================================
         BARRA DE PROGRESSO
    ================================= -->
    <h5 class="mt-4">Progresso:</h5>

    <div class="progress mb-3">
        <div class="progress-bar"
             id="dynamicProgress"
             role="progressbar"
             style="width: 0%;">
            0%
        </div>
    </div>


    
    
    <!-- ================================
         CONTROLES DA BARRA DE PROGRESSO
    ================================= -->

    <div class="btn-group me-2">
        <!-- Diminuir progresso -->
        <button class="btn btn-primary" onclick="updateProgress(-10)">-10%</button>

        <!-- Aumentar progresso -->
        <button class="btn btn-primary" onclick="updateProgress(10)">+10%</button>
    </div>

    <!-- Ligar / Desligar animação -->
    <button class="btn btn-success" id="toggleAnimationBtn" onclick="ToggleAnimacao()">
        Ligar animação
    </button>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script personalizado -->
<script src="teste.js"></script>

</body>
</html>
